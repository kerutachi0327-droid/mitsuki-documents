<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Schedule — Secret Tea Room by Mitsuki Lee</title>
  <style>
    :root {
      --gold: #b8975a;
      --gold-light: #d4b483;
      --gold-pale: #f0e4cc;
      --ink: #0a0a0a;
      --ink-soft: #1a1a1a;
      --cream: #f8f4ee;
      --cream-mid: #ede6da;
      --muted: #888;
      --border: rgba(184, 151, 90, 0.25);

      --c-prep: #7a9e8e;       /* 準備：深緑 */
      --c-recruit: #9e7a8e;    /* 集客：プラム */
      --c-build: #7a8e9e;      /* 構築：スレート */
      --c-content: #9e8e7a;    /* コンテンツ：テラコッタ */
      --c-program: #8e7a9e;    /* プログラム：ラベンダー */
      --c-launch: #b8975a;     /* ローンチ：ゴールド */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--ink);
      color: var(--cream);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      padding: 52px 32px 40px;
      border-bottom: 1px solid var(--border);
    }
    .header-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    header h1 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--cream);
      line-height: 1.3;
    }
    header h1 em {
      font-style: italic;
      color: var(--gold-light);
    }
    .header-sub {
      margin-top: 12px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 24px auto 0;
      max-width: 200px;
    }
    .ornament-line { flex: 1; height: 1px; background: var(--border); }
    .ornament-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      padding: 28px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── GANTT WRAPPER ── */
    .gantt-wrapper {
      padding: 32px 24px 48px;
      overflow-x: auto;
    }

    .gantt {
      min-width: 900px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── WEEK HEADER ── */
    .week-header {
      display: grid;
      grid-template-columns: 220px repeat(52, 1fr);
      margin-bottom: 4px;
    }
    .wh-label { /* empty corner */ }
    .week-band {
      grid-column: span 7;
      text-align: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-transform: uppercase;
      padding: 4px 0 8px;
      border-left: 1px solid var(--border);
    }
    .week-band:last-child { grid-column: span 4; }

    /* Month sub-header */
    .month-row {
      display: grid;
      grid-template-columns: 220px repeat(52, 1fr);
      margin-bottom: 12px;
    }
    .month-label-cell { /* corner */ }
    .day-cell {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 8px;
      color: rgba(255,255,255,0.2);
      text-align: center;
      padding-bottom: 4px;
    }
    .day-cell.month-start {
      color: var(--muted);
      font-size: 9px;
      border-left: 1px solid rgba(184,151,90,0.4);
    }
    .day-cell.today-mark {
      color: var(--gold);
    }

    /* ── PHASE GROUP ── */
    .phase-group { margin-bottom: 6px; }
    .phase-title {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 10px 0 6px;
      border-top: 1px solid var(--border);
    }

    /* ── TASK ROW ── */
    .task-row {
      display: grid;
      grid-template-columns: 220px repeat(52, 1fr);
      align-items: center;
      min-height: 36px;
      margin-bottom: 3px;
    }
    .task-row:hover { background: rgba(255,255,255,0.02); }

    .task-label {
      padding-right: 16px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      color: var(--cream);
      line-height: 1.3;
    }
    .task-label small {
      display: block;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    /* bar cell container */
    .bar-area {
      grid-column: span 52;
      position: relative;
      height: 36px;
      display: grid;
      grid-template-columns: repeat(52, 1fr);
    }

    .bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 14px;
      border-radius: 2px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .bar:hover { opacity: 1; }

    /* milestone diamond */
    .milestone {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: var(--gold);
      z-index: 10;
    }
    .milestone-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      color: var(--gold-light);
      white-space: nowrap;
      padding-left: 12px;
      letter-spacing: 0.05em;
    }

    /* Today line */
    .today-line {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 1px;
      background: rgba(184,151,90,0.6);
      z-index: 20;
    }

    /* vertical grid lines */
    .grid-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(52, 1fr);
    }
    .grid-col {
      border-left: 1px solid rgba(255,255,255,0.04);
    }
    .grid-col.week-start {
      border-left: 1px solid rgba(184,151,90,0.12);
    }
    .grid-col.month-start {
      border-left: 1px solid rgba(184,151,90,0.3);
    }

    /* ── MILESTONE ROW ── */
    .milestone-row {
      display: grid;
      grid-template-columns: 220px repeat(52, 1fr);
      align-items: center;
      min-height: 40px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
    }
    .milestone-row-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .milestone-row-area {
      grid-column: span 52;
      position: relative;
      height: 40px;
      display: grid;
      grid-template-columns: repeat(52, 1fr);
    }
    .ms-pin {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ms-pin-diamond {
      width: 10px;
      height: 10px;
      background: var(--gold);
      transform: rotate(45deg);
      margin: 0 auto 4px;
    }
    .ms-pin-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 8px;
      color: var(--gold-light);
      white-space: nowrap;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.05em;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px;
      border-top: 1px solid var(--border);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    footer span { color: var(--gold); }

    /* ── LAUNCH BANNER ── */
    .launch-banner {
      margin: 32px 24px 0;
      border: 1px solid var(--gold);
      text-align: center;
      padding: 20px 24px;
      background: rgba(184,151,90,0.06);
    }
    .launch-banner-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .launch-banner-date {
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--cream);
    }
    .launch-banner-sub {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <p class="header-label">Master Schedule</p>
  <h1>Secret Tea Room by <em>Mitsuki Lee</em></h1>
  <p class="header-sub">2026.07.16 — 2026.09.06 &nbsp;·&nbsp; 52 Days to Launch</p>
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-dot"></div>
    <div class="ornament-line"></div>
  </div>
</header>

<!-- LEGEND -->
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-prep)"></div>準備</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-recruit)"></div>集客</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-build)"></div>構築</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-content)"></div>コンテンツ</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-program)"></div>モニタープログラム</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--c-launch)"></div>ローンチ準備</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--gold); transform:rotate(45deg)"></div>マイルストーン</div>
</div>

<!-- GANTT -->
<div class="gantt-wrapper">
  <div class="gantt" id="gantt"></div>
</div>

<!-- LAUNCH BANNER -->
<div class="launch-banner">
  <p class="launch-banner-label">Launch Day</p>
  <p class="launch-banner-date">2026年9月6日（日）11:00</p>
  <p class="launch-banner-sub">Secret Tea Room by Mitsuki Lee — Grand Opening</p>
</div>

<footer>
  Produced by Kenty &nbsp;·&nbsp; <span>OTOMIZU</span> &nbsp;·&nbsp; Confidential
</footer>

<script>
// ── CONFIG ──────────────────────────────────────────────
const START = new Date(2026, 6, 16); // 7/16
const END   = new Date(2026, 8, 6);  // 9/6
const TODAY = new Date(2026, 6, 17); // 7/17

// Total days
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}
const TOTAL_DAYS = daysBetween(START, END); // 52

// Convert date → column index (0-based)
function dayIndex(d) { return daysBetween(START, d); }

// Tasks: { label, sub, start, end, color }
const PHASES = [
  {
    title: '▸ 準備フェーズ',
    tasks: [
      { label: 'みつき素材収集', sub: '写真・プロフィール・テキスト', start: new Date(2026,6,16), end: new Date(2026,6,20), color: 'var(--c-prep)' },
      { label: 'VIVIビデオ手配', sub: '英会話収録・期限 7/31', start: new Date(2026,6,16), end: new Date(2026,6,31), color: 'var(--c-content)' },
    ]
  },
  {
    title: '▸ 集客フェーズ',
    tasks: [
      { label: 'LINEオープンチャット開設・運用', sub: 'URL共有→インスタ誘導', start: new Date(2026,6,17), end: new Date(2026,7,9), color: 'var(--c-recruit)' },
      { label: 'インスタストーリー告知', sub: 'モニター募集訴求', start: new Date(2026,6,17), end: new Date(2026,7,9), color: 'var(--c-recruit)' },
    ]
  },
  {
    title: '▸ 構築フェーズ',
    tasks: [
      { label: 'LINE友達追加LP構築', sub: '素材届き次第（7/20〜）', start: new Date(2026,6,20), end: new Date(2026,7,5), color: 'var(--c-build)' },
      { label: 'UTAGEファネル設定', sub: 'ステップ配信・会員サイト', start: new Date(2026,6,25), end: new Date(2026,7,15), color: 'var(--c-build)' },
    ]
  },
  {
    title: '▸ モニター選定',
    tasks: [
      { label: 'モニター選定 10名', sub: 'クローズド募集・LINEグループ作成', start: new Date(2026,7,1), end: new Date(2026,7,9), color: 'var(--c-prep)' },
    ]
  },
  {
    title: '▸ モニタープログラム',
    tasks: [
      { label: 'Week 1 ｜ 食事法', sub: '収録ビデオ 1h 配信', start: new Date(2026,7,10), end: new Date(2026,7,16), color: 'var(--c-program)' },
      { label: 'Week 2 ｜ 英会話（VIVI）', sub: 'VIVIビデオ＋みつき実践', start: new Date(2026,7,17), end: new Date(2026,7,23), color: 'var(--c-program)' },
      { label: 'Week 3 ｜ モデルペルソナ', sub: '収録ビデオ 1h 配信', start: new Date(2026,7,24), end: new Date(2026,7,30), color: 'var(--c-program)' },
      { label: 'Week 4 ｜ ZOOMライブ', sub: '8/30（日）11:00 アーカイブあり', start: new Date(2026,7,31), end: new Date(2026,7,23), color: 'var(--c-program)' },
    ]
  },
  {
    title: '▸ ローンチ準備',
    tasks: [
      { label: '感想収集・LP制作', sub: 'モニター声・ビフォーアフター', start: new Date(2026,7,24), end: new Date(2026,8,5), color: 'var(--c-launch)' },
      { label: 'UTAGE本番公開設定', sub: 'Stripe・会員サイト最終確認', start: new Date(2026,8,1), end: new Date(2026,8,5), color: 'var(--c-launch)' },
    ]
  },
];

// Fix Week4 (end should be 8/23 since ZOOM is 8/23)
PHASES[4].tasks[3].start = new Date(2026,7,17);
PHASES[4].tasks[3].end   = new Date(2026,7,23);

// Milestones
const MILESTONES = [
  { date: new Date(2026,6,20), label: '7/20\nみつき素材' },
  { date: new Date(2026,6,31), label: '7/31\nVIVIビデオ期限' },
  { date: new Date(2026,7,23), label: '8/23\nZOOM Week4' },
  { date: new Date(2026,8,6),  label: '9/6\n🎉 LAUNCH' },
];

// ── BUILD GANTT ──────────────────────────────────────────
const gantt = document.getElementById('gantt');

// Week header
function buildWeekHeader() {
  const row = document.createElement('div');
  row.className = 'week-header';

  const corner = document.createElement('div');
  corner.className = 'wh-label';
  row.appendChild(corner);

  const weeks = [
    { label: 'W1  7/16', days: 7 },
    { label: 'W2  7/23', days: 7 },
    { label: 'W3  7/30', days: 7 },
    { label: 'W4  8/6',  days: 7 },
    { label: 'W5  8/13', days: 7 },
    { label: 'W6  8/20', days: 7 },
    { label: 'W7  8/27', days: 7 },
    { label: 'W8  9/3',  days: 4 },
  ];
  weeks.forEach(w => {
    const el = document.createElement('div');
    el.className = 'week-band';
    el.style.gridColumn = `span ${w.days}`;
    el.textContent = w.label;
    row.appendChild(el);
  });
  gantt.appendChild(row);
}

// Day labels row
function buildDayRow() {
  const row = document.createElement('div');
  row.className = 'month-row';

  const corner = document.createElement('div');
  corner.className = 'month-label-cell';
  row.appendChild(corner);

  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = new Date(START.getTime() + i * 86400000);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    // Mark month starts
    if (d.getDate() === 1) {
      cell.classList.add('month-start');
      cell.textContent = `${d.getMonth()+1}/1`;
    } else if (d.getDate() % 7 === 2 && i > 0) { // rough week markers
      cell.textContent = `${d.getDate()}`;
    }
    if (daysBetween(TODAY, d) === 0) cell.classList.add('today-mark');
    row.appendChild(cell);
  }
  gantt.appendChild(row);
}

// Phase + Task rows
function buildPhases() {
  PHASES.forEach(phase => {
    const group = document.createElement('div');
    group.className = 'phase-group';

    const title = document.createElement('div');
    title.className = 'phase-title';
    title.textContent = phase.title;
    group.appendChild(title);

    phase.tasks.forEach(task => {
      const row = document.createElement('div');
      row.className = 'task-row';

      // Label
      const lbl = document.createElement('div');
      lbl.className = 'task-label';
      lbl.innerHTML = task.label + (task.sub ? `<small>${task.sub}</small>` : '');
      row.appendChild(lbl);

      // Bar area
      const area = document.createElement('div');
      area.className = 'bar-area';
      area.style.gridColumn = `2 / span ${TOTAL_DAYS}`;

      // Grid lines
      const grid = document.createElement('div');
      grid.className = 'grid-lines';
      for (let i = 0; i < TOTAL_DAYS; i++) {
        const col = document.createElement('div');
        col.className = 'grid-col';
        const d = new Date(START.getTime() + i * 86400000);
        if (d.getDate() === 1) col.classList.add('month-start');
        else if (i % 7 === 0) col.classList.add('week-start');
        grid.appendChild(col);
      }
      area.appendChild(grid);

      // Today line
      const todayIdx = dayIndex(TODAY);
      const todayPct = (todayIdx / TOTAL_DAYS) * 100;
      const todayLine = document.createElement('div');
      todayLine.className = 'today-line';
      todayLine.style.left = todayPct + '%';
      area.appendChild(todayLine);

      // Bar
      const s = dayIndex(task.start);
      const e = dayIndex(task.end);
      const barLeft = (s / TOTAL_DAYS) * 100;
      const barWidth = ((e - s + 1) / TOTAL_DAYS) * 100;

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.left = barLeft + '%';
      bar.style.width = barWidth + '%';
      bar.style.background = task.color;
      area.appendChild(bar);

      row.appendChild(area);
      group.appendChild(row);
    });

    gantt.appendChild(group);
  });
}

// Milestone row
function buildMilestoneRow() {
  const row = document.createElement('div');
  row.className = 'milestone-row';

  const lbl = document.createElement('div');
  lbl.className = 'milestone-row-label';
  lbl.textContent = '▸ マイルストーン';
  row.appendChild(lbl);

  const area = document.createElement('div');
  area.className = 'milestone-row-area';
  area.style.gridColumn = `2 / span ${TOTAL_DAYS}`;

  // Grid lines
  const grid = document.createElement('div');
  grid.className = 'grid-lines';
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const col = document.createElement('div');
    col.className = 'grid-col';
    const d = new Date(START.getTime() + i * 86400000);
    if (d.getDate() === 1) col.classList.add('month-start');
    else if (i % 7 === 0) col.classList.add('week-start');
    grid.appendChild(col);
  }
  area.appendChild(grid);

  MILESTONES.forEach(ms => {
    const idx = dayIndex(ms.date);
    const pct = ((idx + 0.5) / TOTAL_DAYS) * 100;

    const pin = document.createElement('div');
    pin.className = 'ms-pin';
    pin.style.left = pct + '%';
    pin.style.position = 'absolute';
    pin.style.top = '50%';
    pin.style.transform = 'translate(-50%, -50%)';
    pin.style.textAlign = 'center';

    const diamond = document.createElement('div');
    diamond.className = 'ms-pin-diamond';
    pin.appendChild(diamond);

    const pinLbl = document.createElement('div');
    pinLbl.className = 'ms-pin-label';
    pinLbl.innerHTML = ms.label.replace('\n', '<br>');
    pin.appendChild(pinLbl);

    area.appendChild(pin);
  });

  row.appendChild(area);
  gantt.appendChild(row);
}

buildWeekHeader();
buildDayRow();
buildPhases();
buildMilestoneRow();
</script>
</body>
</html>
